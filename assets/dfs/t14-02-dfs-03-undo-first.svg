<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e53935"/>
    </marker>
  </defs>

  <!-- 未走過的邊（6 條） -->
  <line x1="250" y1="70"  x2="393" y2="174" stroke="#cfd8dc" stroke-width="2"/>
  <line x1="393" y1="174" x2="338" y2="341" stroke="#cfd8dc" stroke-width="2"/>
  <line x1="338" y1="341" x2="162" y2="341" stroke="#cfd8dc" stroke-width="2"/>
  <line x1="250" y1="220" x2="250" y2="70"  stroke="#cfd8dc" stroke-width="2"/>
  <line x1="250" y1="220" x2="393" y2="174" stroke="#cfd8dc" stroke-width="2"/>
  <line x1="250" y1="220" x2="338" y2="341" stroke="#cfd8dc" stroke-width="2"/>

  <!-- 撤銷的邊：②5→6 -->
  <line x1="115.1" y1="198.7" x2="153.9" y2="316.3" stroke="#e53935" stroke-width="3" stroke-dasharray="7 5" opacity="0.55" marker-end="url(#arrow)"/>
  <circle cx="134.5" cy="257.5" r="12" fill="#ffffff" opacity="0.9"/>
  <text x="134.5" y="257.5" font-size="20" fill="#e53935" text-anchor="middle" dy=".35em">✗</text>

  <!-- 走過的邊：①1→5、③5→4、④4→6 -->
  <line x1="229.0" y1="85.3"  x2="128.0" y2="158.7" stroke="#e53935" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="131.8" y1="182.0" x2="225.3" y2="212.0" stroke="#e53935" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="234.7" y1="241.0" x2="177.3" y2="320.0" stroke="#e53935" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 節點 -->
  <circle cx="250" cy="70"  r="26" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <circle cx="393" cy="174" r="26" fill="#ffffff" stroke="#90a4ae" stroke-width="2.5"/>
  <circle cx="338" cy="341" r="26" fill="#ffffff" stroke="#90a4ae" stroke-width="2.5"/>
  <circle cx="162" cy="341" r="26" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <circle cx="107" cy="174" r="26" fill="#ffffff" stroke="#90a4ae" stroke-width="2.5"/>
  <circle cx="250" cy="220" r="26" fill="#ffffff" stroke="#90a4ae" stroke-width="2.5"/>

  <text x="250" y="70"  font-size="18" fill="#263238" text-anchor="middle" dy=".35em">1</text>
  <text x="393" y="174" font-size="18" fill="#263238" text-anchor="middle" dy=".35em">2</text>
  <text x="338" y="341" font-size="18" fill="#263238" text-anchor="middle" dy=".35em">3</text>
  <text x="162" y="341" font-size="18" fill="#263238" text-anchor="middle" dy=".35em">6</text>
  <text x="107" y="174" font-size="18" fill="#263238" text-anchor="middle" dy=".35em">5</text>
  <text x="250" y="220" font-size="18" fill="#263238" text-anchor="middle" dy=".35em">4</text>

  <!-- 序號標籤 -->
  <circle cx="150" cy="98" r="13" fill="#ffffff"/>
  <text x="150" y="98" font-size="16" fill="#263238" text-anchor="middle" dy=".35em">①</text>

  <circle cx="100" cy="257" r="13" fill="#ffffff"/>
  <text x="100" y="257" font-size="16" fill="#263238" text-anchor="middle" dy=".35em">②</text>

  <circle cx="155" cy="185" r="13" fill="#ffffff"/>
  <text x="155" y="185" font-size="16" fill="#263238" text-anchor="middle" dy=".35em">③</text>

  <circle cx="188" cy="300" r="13" fill="#ffffff"/>
  <text x="188" y="300" font-size="16" fill="#263238" text-anchor="middle" dy=".35em">④</text>
</svg>
