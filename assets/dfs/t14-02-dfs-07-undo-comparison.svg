<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e53935"/>
    </marker>
  </defs>

  <!-- 標題 -->
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#263238">撤銷前：路徑 2 走到終點</text>
  <text x="20" y="205" font-size="16" font-weight="bold" fill="#263238">撤銷後：改走路徑 3</text>
  <line x1="20" y1="170" x2="540" y2="170" stroke="#cfd8dc" stroke-width="1"/>

  <!-- 上半：a1 --> a5 --> a6 -->
  <line x1="114" y1="90" x2="256" y2="90" stroke="#e53935" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="304" y1="90" x2="446" y2="90" stroke="#e53935" stroke-width="4" marker-end="url(#arrow)"/>

  <circle cx="90"  cy="90" r="24" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <circle cx="280" cy="90" r="24" fill="#ffffff" stroke="#90a4ae" stroke-width="2.5"/>
  <circle cx="470" cy="90" r="24" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="90"  y="90" font-size="18" fill="#263238" text-anchor="middle" dy=".35em">1</text>
  <text x="280" y="90" font-size="18" fill="#263238" text-anchor="middle" dy=".35em">5</text>
  <text x="470" y="90" font-size="18" fill="#263238" text-anchor="middle" dy=".35em">6</text>

  <circle cx="185" cy="72" r="13" fill="#ffffff"/>
  <text x="185" y="72" font-size="16" fill="#263238" text-anchor="middle" dy=".35em">①</text>
  <circle cx="375" cy="72" r="13" fill="#ffffff"/>
  <text x="375" y="72" font-size="16" fill="#263238" text-anchor="middle" dy=".35em">②</text>

  <!-- 下半：b1 --> b5，b5 撤銷--> b6（虛線），b5 --> b4 --> b6 -->
  <line x1="104" y1="270" x2="226" y2="270" stroke="#e53935" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="272.77" y1="262.41" x2="437.23" y2="207.59" stroke="#e53935" stroke-width="3" stroke-dasharray="7 5" opacity="0.55" marker-end="url(#arrow)"/>
  <line x1="271.75" y1="280.15" x2="378.25" y2="329.85" stroke="#e53935" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="409.45" y1="317.94" x2="450.55" y2="222.06" stroke="#e53935" stroke-width="4" marker-end="url(#arrow)"/>

  <circle cx="355" cy="235" r="12" fill="#ffffff" opacity="0.9"/>
  <text x="355" y="235" font-size="20" fill="#e53935" text-anchor="middle" dy=".35em">✗</text>

  <circle cx="80"  cy="270" r="24" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <circle cx="250" cy="270" r="24" fill="#ffffff" stroke="#90a4ae" stroke-width="2.5"/>
  <circle cx="400" cy="340" r="24" fill="#ffffff" stroke="#90a4ae" stroke-width="2.5"/>
  <circle cx="460" cy="200" r="24" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="80"  y="270" font-size="18" fill="#263238" text-anchor="middle" dy=".35em">1</text>
  <text x="250" y="270" font-size="18" fill="#263238" text-anchor="middle" dy=".35em">5</text>
  <text x="400" y="340" font-size="18" fill="#263238" text-anchor="middle" dy=".35em">4</text>
  <text x="460" y="200" font-size="18" fill="#263238" text-anchor="middle" dy=".35em">6</text>

  <circle cx="165" cy="250" r="13" fill="#ffffff"/>
  <text x="165" y="250" font-size="16" fill="#263238" text-anchor="middle" dy=".35em">①</text>

  <rect x="318" y="245" width="74" height="20" rx="4" fill="#ffffff" opacity="0.9"/>
  <text x="355" y="255" font-size="13" fill="#263238" text-anchor="middle" dy=".35em">②已撤銷</text>

  <circle cx="330" cy="325" r="13" fill="#ffffff"/>
  <text x="330" y="325" font-size="16" fill="#263238" text-anchor="middle" dy=".35em">③</text>

  <circle cx="450" cy="290" r="13" fill="#ffffff"/>
  <text x="450" y="290" font-size="16" fill="#263238" text-anchor="middle" dy=".35em">④</text>
</svg>
